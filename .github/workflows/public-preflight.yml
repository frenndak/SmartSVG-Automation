name: SmartSVG - Public Orchestration Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public repository (no private assets)
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
          python tools/check_public_repo.py --repo .
