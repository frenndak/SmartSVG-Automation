name: SmartSVG - Secure half-hour orchestration

on:
  schedule:
    - cron: "20 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [develop, repair]
        default: develop

permissions:
  contents: read

concurrency:
  group: smartsvg-public-dispatch
  cancel-in-progress: false

jobs:
  signal-private-engineer:
    if: vars.SMARTSVG_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch phase to private SmartSVG repository only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SMARTSVG_DISPATCH_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing private repository dispatch token."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              "20 * * * *") phase="develop" ;;
              "50 * * * *") phase="repair" ;;
              *) echo "::error::Unexpected schedule"; exit 1 ;;
            esac
          else
            phase="${REQUESTED_PHASE:-develop}"
          fi
          if [[ "$phase" != "develop" && "$phase" != "repair" ]]; then
            echo "::error::Invalid phase"; exit 1
          fi
          printf '{"event_type":"smartsvg-cycle","client_payload":{"phase":"%s"}}' "$phase" |
            gh api -X POST repos/frenndak/SmartSVG-Studio/dispatches --input - >/dev/null
          echo "SmartSVG private cycle dispatched ($phase). No private source checked out."
